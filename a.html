<!doctype html>
<meta charset=utf-8>
<meta name=viewport content=width=device-width,initial-scale=1.0>

<style>
:root{--pagewidth:30em}

body{background:#333;color:#fff;text-align:center}
body,td,th{font-size:15px;line-height:1.8;
  font-family:Arial,Helvetica,'Liberation Sans','Nimbus Sans',sans-serif}

p,pre,ul,li,blockquote,table,dl{text-align:left}
p{max-width:var(--pagewidth);margin:1em auto}
pre,dl{margin:1em auto;width:fit-content;max-width:min(100%, 1000px);
  box-sizing:border-box}
hr{border:none;border-top: 2px solid #bbb;margin:1em auto;
  max-width:var(--pagewidth)}

a,a .quote{text-decoration:none;color:hsl(220,94%,75%)}
a:visited,a .quote{color:hsl(270,94%,75%)}

pre,code{white-space:pre-wrap;word-wrap:break-word;
  font:.93em Menlo,'DejaVu Sans Mono','Liberation Mono',Consolas,monospace;
  background:#555;color:white}
pre{padding:4px;line-height:1.4}
code{padding:1px}

h1,h2,h3,h4,h2 a,h3 a,h4 a,h2 a:visited,h3 a:visited,h4 a:visited{color:white;
  font-weight:normal;line-height:1.3}
h2 a,h3 a{text-decoration:underline}
h2 a:focus,h3 a:focus{outline:none}
h1{font-size:2.1em;margin:.7em 0 .5em 0}
h2{font-size:1.75em}
h3{font-size:1.35em}
h4{font-size:1.17em}

ul,ol{width:min(100%, var(--pagewidth));margin:1em auto;
  box-sizing:border-box}
ul ul,ul ol,ol ol,ol ul{margin-top:0;margin-bottom:0}

table{border-collapse:collapse;margin:0 auto;max-width:100%}
td,th{border:1px solid #606060;padding:1px 3px}
th{background:#494949;font-weight:bold}

img{max-width:100%;margin:2px;vertical-align:middle}
body>div{width:fit-content;margin:0 auto}

dt{font-size:1.3em;margin:.4em 0}

sup{vertical-align:0;position:relative;bottom:1.1ex}
sub{vertical-align:0;position:relative;top:0.8ex}

body>blockquote{margin:1em auto;padding-left:40px;
  max-width:calc(var(--pagewidth) - 40px)}
blockquote blockquote{width:calc(100% - 40px);margin-left:40px;
  box-sizing:border-box}
blockquote>:first-child{margin-top:0}
blockquote>:last-child{margin-bottom:0}
blockquote h2,blockquote h3,blockquote h4{margin:.5em 0}
blockquote ul,blockquote ol{margin:.4em 0}
blockquote h3,blockquote h4{color:inherit}

.quote{color:hsl(0,0%,81%)}
.quote .quote{color:hsl(0,0%,65%)}
.quote .quote .quote{color:hsl(0,0%,53%)}
.quote .quote .quote .quote{color:hsl(0,0%,41%)}
.quote .quote .quote .quote .quote{color:hsl(0,0%,33%)}
.quote .quote .quote .quote .quote .quote{color:hsl(0,0%,28%)}

.spoiler{max-width:1060px;margin:0 auto}
.spoiler button{width:90px;border:0;font-family:inherit;font-size:inherit;
  color:inherit;background:#555;padding:4px 0px;outline:none;cursor:pointer;
  margin:0 0 -.3em 0}
.spoiler pre{display:none;margin-top:0;text-align:left}

body>.toc{box-sizing:border-box;
  width:calc(100% - 8px - max(0px,50vw - var(--pagewidth)/2 - 20px));
  margin-left:max(0px,50vw - 8px - var(--pagewidth)/2 - 20px)}
body>.toc ul{width:100%;box-sizing:border-box}

.red,.red .quote{color:hsl(0,100%,77%)!important}
.comment{color:hsl(0,100%,80%)!important}
.dates{color:#ccc}
.wide{width:min(100%, 1000px)}
.fullwidth{max-width:100%}

#pagenumber{position:fixed;right:12px;bottom:12px;
  user-select:none;cursor:default}

@media print{
  body{background:white;color:black;margin:0px;zoom:.85;
    print-color-adjust:exact;-webkit-print-color-adjust:exact}
  a,a:visited{color:#0000EE}
  h1,h2,h2 a,h3 a,h2 a:visited,h3 a:visited{color:black}
  pre,code{background:#d6d6d6;color:black}
  th{background:#ddd}
  td,th{border:1px solid #ccc}
  .quote{color:hsl(0,0%,42%)}
  .quote .quote{color:hsl(0,0%,60%)}
  .quote .quote .quote{color:hsl(0,0%,78%)}
  .quote .quote .quote .quote{color:hsl(0,0%,88%)}
  .spoiler{display:none}
  .red,.red .quote{color:hsl(0,70%,70%)!important}
  .comment{color:hsl(0,40%,60%)!important}
  .dates{color:#777}
  #pagenumber,#readercontrols{display:none}
}

#readercontrols{position:fixed;right:12px;top:50%;transform:translateY(-50%);
  z-index:2;line-height:1.6;font-size:15px}
#readerbuttons{display:flex;flex-direction:column;gap:4px}
#readerbuttons button{border:none;width:48px;height:48px;color:white;
  background:rgba(40,40,40,.6);cursor:pointer;font-size:16px}
@media(hover:hover) and (pointer:fine){#upbutton,#downbutton{display:none}}

#contentspanel{box-sizing:border-box;position:fixed;right:64px;top:50%;
  transform:translateY(-50%);z-index:2;
  overflow:auto;overscroll-behavior:contain;
  padding:10px;max-width:calc(100% - 76px);max-height:calc(100% - 10px);
  color:#fff;line-height:1.6}
#contentspanel .toc{white-space:nowrap;max-width:calc(100vw - 92px)}
#contentspanel ul{margin:0;list-style:none}
#contentspanel>ul{padding:0}
.currentsection{color:white !important}

#stylepanel{position:absolute;right:52px;top:50%;transform:translateY(-50%);
  width:max-content;padding:6px;color:#fff}
.control{display:grid;grid-template-columns:auto auto;justify-content:end;
  align-items:center;column-gap:10px;margin:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;appearance:none;border:none;
  color:black;font-weight:bold;cursor:pointer}
.stepper span{width:54px;text-align:center}

#contentspanel,#stylepanel{background:rgba(40,40,40,.95)}
#contentspanel,#stylepanel,#stylebutton,#topbutton{display:none}
#contentspanel.open,#stylepanel.open{display:block}
#readercontrols *{touch-action:manipulation;user-select:none;-webkit-touch-callout:none}
</style>
<title></title>
<h1 id=top> - <a href=index.html>sars2.net</a></h1><div class=dates>First published  UTC, last modified 2026-08-08 UTC</div>
<div id=pagenumber></div>
<script>
document.querySelectorAll('.spoiler button').forEach(x=>{
  x.addEventListener('click',()=>{
    const block=x.nextElementSibling
    const isHidden=block.style.display=='none'||!block.style.display
    block.style.display=isHidden?'block':'none'
    x.textContent=isHidden?'Hide code':'Show code'
  })
})
</script>
<div id=contentspanel></div>
<div id=readercontrols>
  <div id=readerbuttons>
    <button id=topbutton>Top</button>
    <button id=stylebutton>Style</button>
    <button id=contentsbutton>≡</button>
    <button id=upbutton>▲</button>
    <button id=downbutton>▼</button>
  </div>
  <div id=stylepanel>
    <div class=control>
      <span>Width</span>
      <div class=stepper>
        <button id=pagewidthminus>−</button>
        <span id=pagewidthvalue></span>
        <button id=pagewidthplus>+</button>
      </div>
    </div>
    <div class=control>
      <span>Font size</span>
      <div class=stepper>
        <button id=fontsizeminus>−</button>
        <span id=fontsizevalue></span>
        <button id=fontsizeplus>+</button>
      </div>
    </div>
    <div class=control>
      <span>Line height</span>
      <div class=stepper>
        <button id=lineheightminus>−</button>
        <span id=lineheightvalue></span>
        <button id=lineheightplus>+</button>
      </div>
    </div>
  </div>
</div>

<script>
function pagenum(){
  let h=innerHeight-40
  let cur=Math.round((scrollY-h/2)/h)+1
  let tot=Math.max(1,Math.round((document.body.scrollHeight-h/2)/h))
  document.getElementById("pagenumber").textContent=cur+" / "+tot
}

addEventListener("load",pagenum)
addEventListener("scroll",pagenum,{passive:true})
addEventListener("resize",pagenum,{passive:true})

let fontsize=parseFloat(localStorage.getItem("fontsize"))||15
let lineheight=parseFloat(localStorage.getItem("lineheight"))||1.8
lineheight=Math.round(lineheight*10)/10
let pagewidth=parseFloat(localStorage.getItem("pagewidth"))||30

document.documentElement.style.setProperty("--pagewidth",pagewidth+"em")
document.body.style.fontSize=fontsize+"px"
document.body.style.lineHeight=(lineheight*fontsize)+"px"

let contentspanel=document.getElementById("contentspanel")
let stylepanel=document.getElementById("stylepanel")
let topbutton=document.getElementById("topbutton")
let stylebutton=document.getElementById("stylebutton")
let contentsbutton=document.getElementById("contentsbutton")
let upbutton=document.getElementById("upbutton")
let downbutton=document.getElementById("downbutton")

let toc=document.querySelector("body>ul.toc")
if(toc)contentspanel.appendChild(toc.cloneNode(true))

topbutton.onpointerdown=e=>{
  scrollTo(0,0)
  history.replaceState(null,"",location.pathname+location.search)
  hidepanels()
}

stylebutton.onpointerdown=e=>{
  e.stopPropagation()
  contentspanel.classList.remove("open")
  stylepanel.classList.toggle("open")
}

contentsbutton.onpointerdown=e=>{
  e.stopPropagation()
  stylepanel.classList.remove("open")

  let open=contentspanel.classList.toggle("open")
  stylebutton.style.display=open?"block":"none"
  if(scrollY>0)topbutton.style.display=open?"block":"none"
  if(open)scrollcontents()
}

upbutton.onpointerdown=()=>{scrollBy(0,40-innerHeight);hidepanels()}
downbutton.onpointerdown=()=>{scrollBy(0,innerHeight-40);hidepanels()}

let headings=[...document.querySelectorAll("h2 a,h3 a")]
let contentlinks=contentspanel.querySelectorAll("a")
let anchorids=new Map([...contentlinks].map(x=>[x.hash.slice(1),x]))

function scrollcontents(){
  contentlinks.forEach(x=>x.classList.remove("currentsection"))

  let newscroll=0
  for(let i=headings.length-1;i>=0;i--){
    if(headings[i].getBoundingClientRect().top<=innerHeight/2){
      let a=anchorids.get(headings[i].id)
      if(headings[i].id!="Contents"){
        a.classList.add("currentsection")
        newscroll=a.offsetTop-contentspanel.clientHeight/2+a.offsetHeight/2
      }
      break
    }
  }

  contentspanel.scrollTop=newscroll
}

addEventListener("scroll",()=>{
  if(contentspanel.classList.contains("open"))scrollcontents()
},{passive:true})

function updatestyle(){
  let scrollratio=(scrollY+innerHeight/2)/document.body.scrollHeight

  document.documentElement.style.setProperty("--pagewidth",pagewidth+"em")
  document.body.style.fontSize=fontsize+"px"
  document.body.style.lineHeight=(lineheight*fontsize)+"px"

  localStorage.setItem("pagewidth",pagewidth)
  localStorage.setItem("fontsize",fontsize)
  localStorage.setItem("lineheight",lineheight)

  document.getElementById("pagewidthvalue").textContent=pagewidth.toFixed(0)+" em"
  document.getElementById("fontsizevalue").textContent=fontsize.toFixed(0)+" px"
  document.getElementById("lineheightvalue").textContent=lineheight.toFixed(1)

  scrollTo(0,scrollratio*document.body.scrollHeight-innerHeight/2)

  pagenum()
}

document.getElementById("pagewidthplus").onpointerdown=()=>{
  let incr=pagewidth>=40?4:2
  pagewidth=Math.min(Math.floor(innerWidth/fontsize/2)*2,pagewidth+incr)
  updatestyle()
}

document.getElementById("pagewidthminus").onpointerdown=()=>{
  pagewidth=Math.max(20,pagewidth-(pagewidth>40?4:2))
  updatestyle()
}

document.getElementById("fontsizeplus").onpointerdown=()=>{
  fontsize=Math.min(30,fontsize+(fontsize>=20?2:1))
  updatestyle()
}

document.getElementById("fontsizeminus").onpointerdown=()=>{
  fontsize=Math.max(10,fontsize-(fontsize>=22?2:1))
  updatestyle()
}

document.getElementById("lineheightplus").onpointerdown=()=>{
  lineheight=Math.min(3,lineheight+(lineheight>=2?.2:.1))
  updatestyle()
}

document.getElementById("lineheightminus").onpointerdown=()=>{
  lineheight=Math.max(1.2,lineheight-(lineheight>=2.2?.2:.1))
  updatestyle()
}

document.querySelectorAll("#readercontrols button,#stylepanel button").forEach(x=>{
  x.addEventListener("touchstart",e=>e.preventDefault(),{passive:false})
  x.addEventListener("pointerdown",e=>e.preventDefault(),{passive:false})
})

function hidepanels(){
  stylepanel.classList.remove("open")
  contentspanel.classList.remove("open")
  topbutton.style.display="none"
  stylebutton.style.display="none"
}

document.addEventListener("click",e=>{
  if(!e.target.closest("#readercontrols"))hidepanels()}
)

document.addEventListener("keydown",e=>{if(e.key=="Escape")hidepanels()})

updatestyle()
</script>
